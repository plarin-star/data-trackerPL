# The daily pipeline. GitHub runs this on its own computers every day.
#
#   05:17 UTC  main run (11:17 PM Central / 12:17 AM New York): hours after the
#              market closed and hours before it opens, so the prices are the
#              last full trading day. GitHub often starts scheduled runs 3 to 5
#              hours late; running early in the UTC day keeps even a late start
#              on the same UTC date, so no date is skipped.
#   07:47 and 09:17 UTC  backup runs. Each skips itself if today's raw files
#              were already saved, so a dropped schedule is covered.
#
# You can also start it by hand: Actions tab > Daily pipeline > Run workflow.
name: Daily pipeline

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "47 7 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the data files
  issues: write     # open and close the daily issue

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Skip a backup run if today already succeeded
        id: check
        run: |
          today=$(date -u +%F)
          schedule="${{ github.event.schedule }}"
          if [ -n "$schedule" ] && [ "$schedule" != "17 5 * * *" ] && ls data/raw/$today/*.gz >/dev/null 2>&1; then
            echo "Today's run already succeeded; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        if: steps.check.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: Fetch, build history, write status, post issue
        if: steps.check.outputs.skip == 'false'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tracker.run

      - name: Commit the data files
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily data: $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
